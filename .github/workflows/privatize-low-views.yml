name: Privatize low-view videos (one-off)
# 1회용(2026-10-15 쿠마님 11612): 조회수 500 이하 영상을 비공개로(삭제 대신 — 되돌릴 수 있음).
# 업로드와 같은 하루 할당량(구글 클라우드 프로젝트 공유)을 쓰므로 업로드가 적은 할당량 창(10/17(토) 16:15 KST)에 돈다.
# 끝나면(로그 '비공개로 바꿈 N') 이 파일을 지운다 — 남겨 두면 내년 같은 날 또 돈다.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 17 10 *'
concurrency:
  group: privatize-low-views
  cancel-in-progress: false
jobs:
  privatize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install google-api-python-client google-auth
      - name: Privatize
        env:
          YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
        run: |
          # cron 은 해마다 같은 날 다시 돈다 — 2026년이 아니면(파일을 못 지웠을 때) 아무것도 안 한다
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then echo "2026년 1회용 — 건너뜀"; exit 0; fi
          mkdir -p credentials
          echo "$YT_TOKEN_B64" | base64 -d > credentials/youtube_token.json
          python scripts/privatize_videos.py archive/privatize_ids_20261015.txt
